name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - run: npm install --legacy-peer-deps
      - run: npm run verify
      - run: npx expo install --check
      - run: npx expo-doctor
